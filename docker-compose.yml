services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-alquilerautos
    environment:
      POSTGRES_DB: alquilerautos_db
      POSTGRES_USER: cloud_usr
      POSTGRES_PASSWORD: cloud_pwd
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud_usr -d alquilerautos_db"]
      interval: 5s
      retries: 5

  microservicio:
    build: .
    container_name: claude-microservicio-v2
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alquilerautos_db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: