spring.application.name=rentacars

# ============================================================
#  CONEXION A DYNAMODB
#  - region:   region de AWS.
#  - endpoint: OPCIONAL. Solo para DynamoDB Local (docker compose):
#              AWS_DYNAMODB_ENDPOINT=http://localhost:8000
#              Vacio = se conecta al DynamoDB real de AWS.
#  - table-prefix: se antepone al nombre de cada tabla (ej. "dev_").
#  - create-tables: crea las tablas al arrancar si no existen.
#
#  LAS CREDENCIALES NO VAN AQUI. Se toman del entorno de AWS:
#  AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, AWS_PROFILE (~/.aws) o el rol
#  de la maquina. Con DynamoDB Local sirven valores cualquiera (ej. "local").
# ============================================================
aws.dynamodb.region=${AWS_REGION:us-east-1}
aws.dynamodb.endpoint=${AWS_DYNAMODB_ENDPOINT:}
aws.dynamodb.table-prefix=${AWS_DYNAMODB_TABLE_PREFIX:}
aws.dynamodb.create-tables=${AWS_DYNAMODB_CREATE_TABLES:true}

# ============================================================
#  JSON (Jackson)
#  SNAKE_CASE traduce automaticamente los nombres de los campos:
#     Java               JSON
#     idTienda        -> "id_tienda"
#     precioDia       -> "precio_dia"
#     fechaInicio     -> "fecha_inicio"
#     tarjetaCredito  -> "tarjeta_credito"
#
#  Gracias a esto NO hay que poner @JsonProperty en ningun DTO.
#  En Java se escribe camelCase (lo normal); el JSON sale como
#  lo pide el backlog. No cambien esta linea.
# ============================================================
spring.jackson.property-naming-strategy=SNAKE_CASE

# No incluir en el JSON los campos que esten en null
spring.jackson.default-property-inclusion=non_null

# ============================================================
#  SWAGGER / OPENAPI
#  Con el proyecto corriendo, abrir en el navegador:
#     http://localhost:8080/swagger-ui.html
#  Sirve para probar los endpoints sin instalar Postman.
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Puerto de la aplicacion
server.port=8080

# ============================================================
#  ERRORES
#  Nunca devolver el stack trace en las respuestas HTTP.
#  (spring-boot-devtools lo activa por defecto; esta linea lo anula.)
# ============================================================
server.error.include-stacktrace=never
